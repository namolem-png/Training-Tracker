name: Build and deploy to VPS

on:
  # Запуск при каждом пуше в ветку main
  push:
    branches: ["main"]

  # Возможность ручного запуска из вкладки Actions
  workflow_dispatch:

# Отменяет предыдущие сборки при частых пушах
concurrency:
  group: "vps-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy static files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "./dist/*"
          target: "/var/www/training-tracker/frontend"
          strip_components: 1